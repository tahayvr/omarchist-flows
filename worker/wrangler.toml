name = "omarchist-flows"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The address the app reads the catalog from. The zone (omarchist.com)
# must be on this Cloudflare account.
[[routes]]
pattern = "flows.omarchist.com"
custom_domain = true

# What CI uploads: v1/index.json, v1/index.json.sig, v1/flows/<slug>/<n>.flow.toml
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "omarchist-flows"

# Install counts. Create it with `wrangler d1 create omarchist-flows`, put
# the id it prints here, then `wrangler d1 execute omarchist-flows --remote
# --file schema.sql`.
[[d1_databases]]
binding = "omarchist_flows"
database_name = "omarchist-flows"
database_id = "6ba061e7-9fa3-4c11-80c5-e133380de3c9"

# At most ten install counts a minute from one address.
[[ratelimits]]
name = "INSTALLS_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# One secret, set once with `wrangler secret put SALT`: any long random
# text. It salts the hashes that keep one address from counting twice.
